[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "painel-notas-turma"
version = "0.2.0"
description = "Consolidação e análise de notas escolares em CSV"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
]

[tool.setuptools.packages.find]
include = ["painel*"]

[tool.ruff]
line-length = 100
target-version = "py310"
